name: rapp
description: "rapp desktop GUI: client manager, and the connection manager with --cm."
publish_to: 'none'

version: 0.15.20+76

environment:
  sdk: ^3.12.1

dependencies:
  crypto: ^3.0.7
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  rapp_rime:
    path: packages/rapp_rime
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/app_profiles.json
    - assets/themes/
