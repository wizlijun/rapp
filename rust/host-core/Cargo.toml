[package]
name = "rapp-host-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rapp-client-core = { path = "../client-core" }
zeroize = "1"
unicode-segmentation = "1"
# Stock zlib, linked statically: the deflate stream must be copyable (deflateCopy)
# and byte-identical to the Swift host's. Only src/deflate.rs touches it.
libz-sys = { version = "1", default-features = false, features = ["static", "stock-zlib"] }

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
