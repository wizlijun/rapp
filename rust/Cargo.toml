[workspace]
resolver = "2"
members = ["net", "relay", "service", "hub", "testkit", "update", "client-core", "client-gtk"]

[workspace.package]
version = "0.5.1"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
tempfile = "3"
rapp-net = { path = "net" }
rapp-relay = { path = "relay" }
rapp-service = { path = "service" }
rapp-hub = { path = "hub" }
rapp-update = { path = "update" }

[profile.release]
lto = "thin"
