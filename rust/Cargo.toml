[workspace]
resolver = "2"
members = ["wire", "conn", "relay", "net", "service", "hub", "testkit", "update", "term", "client-core", "client-gtk"]

[workspace.package]
version = "0.8.1"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
tempfile = "3"
ring = "0.17"
x509-parser = "0.18"
data-encoding = "2"
rapp-wire = { path = "wire" }
rapp-net = { path = "net" }
rapp-conn = { path = "conn" }
rapp-relay = { path = "relay" }
rapp-service = { path = "service" }
rapp-hub = { path = "hub" }
rapp-update = { path = "update" }
rapp-term = { path = "term" }

[profile.release]
lto = "thin"

# The relay image: smallest and fastest binary; an abort on panic ends the process (the container restarts it).
[profile.relay]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
