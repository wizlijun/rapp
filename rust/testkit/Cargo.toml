[package]
name = "rapp-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Fake workers implementing just enough of the spec §5 CLI for integration tests.
# Named fake-* so they can never be mistaken for the real rapp-host / rapp-client;
# tests symlink them under the real names into a temp RAPP_BIN_DIR.
[[bin]]
name = "fake-rapp-host"
path = "src/bin/fake-rapp-host.rs"

[[bin]]
name = "fake-rapp-client"
path = "src/bin/fake-rapp-client.rs"

[[bin]]
name = "rapp-weaknet"
path = "src/bin/rapp-weaknet.rs"

[[bin]]
name = "fake-rapp-term"
path = "src/bin/fake-rapp-term.rs"

[[bin]]
name = "test-rapp-state"
path = "src/bin/test-rapp-state.rs"

[[bin]]
name = "measure-forward"
path = "src/bin/measure_forward.rs"

# host-core itself on the fake platform: stands in as `rapp-host` for the service contract test.
[[bin]]
name = "fake-host-core"
path = "src/bin/fake_host_core.rs"

[lib]
name = "rapp_testkit"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
rand.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rapp-net.workspace = true
# Only for the `test-rapp-state` binary; rApp itself never depends on it.
rapp-state = { path = "../../services/state" }
# The host-core fake platform, the in-process worker harness and its plain-TCP client.
rapp-host-core.workspace = true
rapp-client-core = { path = "../client-core" }

[dev-dependencies]
quinn.workspace = true
tempfile.workspace = true
rapp-service.workspace = true
rapp-hub.workspace = true
rapp-update.workspace = true
rustls.workspace = true
rcgen.workspace = true
rapp-wire.workspace = true
rapp-conn.workspace = true
rapp-relay.workspace = true
