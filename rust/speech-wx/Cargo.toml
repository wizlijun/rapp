[package]
name = "rapp-speech-wx"
version.workspace = true
edition.workspace = true
publish.workspace = true
# The engine files are voicekey's (Apache-2.0, licenses/voicekey-APACHE-2.0.txt); see src/lib.rs.

[lib]
name = "rapp_speech_wx"
# staticlib: linked into the macOS Runner when built with RAPP_SPEECH=wx. iOS takes it inside
# rapp-hub-ffi instead (its `speech-wx` feature): two Rust static libraries in one app clash (design §5.6, P0).
crate-type = ["staticlib", "rlib"]

[features]
# The command-line tool: unpacking the official speech pack and reading wav files. Never in the app.
tool = ["dep:zip", "dep:hound"]

[dependencies]
anyhow.workspace = true
memmap2 = "0.9"
rayon = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
hound = { version = "3", optional = true }

[[bin]]
name = "wxasr"
path = "src/bin/wxasr.rs"
required-features = ["tool"]
