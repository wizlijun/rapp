[package]
name = "rapp-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "rapp-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
quinn.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rand.workspace = true
rapp-net.workspace = true
rapp-wire.workspace = true
rapp-conn.workspace = true
rapp-ports.workspace = true
rapp-update.workspace = true
rapp-term.workspace = true
rustls.workspace = true

# Linux: the pty helpers; every unix: stopping the companion services when the service stops.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
